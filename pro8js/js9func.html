<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
ES6부터는 화살표함수(arrow function)라는 새로운 문법 방식으로 함수를 만들 수 있게 되었다.
화살표 함수는 => 기호를 사용하여 function 키워드를 생략한다.<br>
함수 표현식 보다 단순한 문법으로 함수 처리가 가능해진다.<br>
형식 : let 변수 = (매개변수1,...) => {표현식}
<br>
<script>
    //'use strict'는 JavaScript를 엄격 모드(Strict Mode)로 실행하도록 하는 선언
    'use strict';

    let a =10; //use strict 선언하고 let을 안쓰면 err
    console.log(a);
    //<script type='module'>하면 'use strict'; 자동 적용됨.

    function hap0(a,b){ //함수 이름이 있다
        return a+b;

    }
    document.write(hap0(3,4));
    let niceFunc =hap0;
    document.write(niceFunc(3,4));

    document.write("<br>")

    let hap1 = function(a,b){ //함수 이름이 없다. 변수로 간다.
        return a+b;
    }
    document.write(hap0(3,4));
    
    document.write("<br>")
    let hap2 = (a,b) => a+b; // 위 함수를 화살 함수로 표현
    document.write(hap2(3,4)); 

    document.write("<br>")
    let hap3 = (a,b) => {return a+b}; // 위 함수를 화살 함수로 표현
    document.write(hap3(3,4)); 

    document.write("<br>");
    let double1 =n => {return n * 2};
    document.write(`<br>결과는 ${double1(3)}`);
    
    let sayHi =() => document.write(`<br>안녕하세요`);
    sayHi()

    document.write("<br>");
    let age = 25;
    let welcom = (age <30)? () => document.write(`<br>안녕`):document.write(`<br>반가워`)
    welcom();

    document.write('<br>');
    // 합 계산 
    let sumFunc =(a,b) => { //원래는 function sumFunc(a,b){.....}
        let result = a+b;
        return result;
    }
    document.write(`<br>두 수의 합은 ${sumFunc(5,6)}`);

    document.write("<br>");
    //사칙연산 함수
    let calcFunc = (a,b,op) => {
        if(op==="+") return a +b;
        else if(op==="-") return a - b;
        else if(op==="*") return a * b;
        else if(op==="/") return a / b;
        else return 0;
    }
    document.write(calcFunc(10,5, '+'));
    document.write("<br>");
    document.write(calcFunc(10,5, '*'));

    document.write("<br>");
    //배열 고차 함수 활용
    //filter() : 조건에 맞는 데이터 추출
    //map() : 데이터를 원하는 형태로 반환 
    // forEach() : 데이터를 하나씩 반복 처리 
    const employees= [
        {name:"가나다", pay:280},
        {name:"김치국", pay:350},
        {name:"박치기", pay:400},
        {name:"전우진", pay:500},
    ];
    // 급여가 300 이상인 직원만 선택 
    const highpay= employees.filter(emp => emp.pay >= 300);
    document.write("highpay: ", highpay);
    console.log(highpay);


</script>



</body>
</html>
