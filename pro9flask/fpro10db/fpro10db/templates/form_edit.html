<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>* 상품 수정 *</h3>
    {% if messages %} <!-- flash 메세지 관 출력-->
        <ul>
        {% for message in messages %}
            <li>{{ message }}</li>  <!-- m -> message로 수정: for문에서 만든 변수 이름과 맞춤 -->
        {% endfor %}
        </ul>
    {% endif %}
    <form action="{{url_for('edit_save', code=row.code)}}" method="post">
        <p>코드: <b>{{ row.code }}</b> (pk는 수정에서 제외. 그래서 보기로 처리)</p>
        <p>상품명: <input name="sang" value="{{ row.sang }}" id="sang"></p>
        <p>수량: <input name="su" value="{{ row.su }}" id="su"></p>
        <p>단가: <input name="dan" value="{{ row.dan }}" id="dan" ></p>
        <button type="submit">수정</button>
        <a href="{{url_for('show_list')}}">수정 취소</a>
    </form>
</body>
</html>
